name: quality-gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical context and application
        id: verify
        run: npm run verify
      - name: Notify Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - shiire_judge_v5_vercel-1: quality-gate'
          state: ${{ steps.verify.outcome == 'success' && 'success' || 'error' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
