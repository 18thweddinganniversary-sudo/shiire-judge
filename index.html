<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a42"><title>仕入れ判断 v9.38</title><link rel="stylesheet" href="/styles.css?v=9380"><script defer src="https://unpkg.com/@zxing/browser@0.2.1"></script><script defer src="/decision-engine.js?v=9380"></script><script defer src="/jan-ocr-core.js?v=9380"></script><script defer src="/app.js?v=9380"></script></head><body>
<main class="app"><header><h1>仕入れ判断 <span>v9.38 統合安定版</span></h1><p>JANを読む → 店頭価格を入れる → 🟢／🔴で即判断</p></header>
<section class="camera-card" aria-label="JANスキャナー"><video id="video" playsinline muted></video><div class="scan-frame" aria-hidden="true"></div><div id="cameraMessage" class="camera-message">カメラを準備しています</div></section>
<section class="controls"><button id="cameraButton" class="secondary" type="button">カメラを再開</button><button id="ocrButton" class="ocr" type="button">画面のJAN文字を読む</button><small>バーコードがない時は、JANの13桁を大きく映して押してください</small><div class="search-row"><input id="manualJan" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="JANを手入力" aria-label="JANコード"><button id="searchButton" type="button">検索</button></div></section>
<div id="status" class="status">起動中…</div><div id="keepaStatus" class="status">Keepa：商品検索時に接続します</div>
<section class="products"><div class="section-title"><b>読み取った商品</b><button id="clearButton" class="text-button" type="button">履歴クリア</button></div><div id="productList" class="product-list"></div></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailName"><div class="sheet"><div class="grab"></div><div class="product-head"><div id="detailImage" class="thumb">📦</div><div><b id="detailName"></b><div id="detailMeta" class="meta"></div></div></div>
<section class="detail-section"><h2>Amazon / Keepa</h2><div class="stats"><div>現在新品<b id="statCurrent">-</b></div><div>90日平均<b id="statAverage">-</b></div><div>新品出品者<b id="statOffers">-</b></div><div>月販 / Rank<b id="statDemand">-</b></div><div>Amazon本体<b id="statAmazon">-</b></div><div>FBA手数料<b id="statFba">-</b></div></div></section>
<section class="detail-section"><h2>仕入れ目安</h2><div class="stats guide-stats"><div>🟢安全目安<b id="safeGuide">-</b></div><div>現在価格での上限<b id="currentGuide">-</b></div><div>90日平均での上限<b id="averageGuide">-</b></div></div></section>
<section class="detail-section"><label class="cost-label" for="costInput">店頭の仕入れ価格</label><input id="costInput" class="cost-input" type="text" inputmode="numeric" autocomplete="off" placeholder="例：1,500"></section>
<section id="verdict" class="verdict red"><div id="verdictSignal" class="verdict-signal">🔴</div><div id="verdictTitle" class="verdict-title">仕入れ価格を入力</div><div id="profit" class="profit">-</div><div class="metrics"><div>利益率<b id="margin">-</b></div><div>ROI<b id="roi">-</b></div><div>手数料計<b id="fees">-</b></div></div><div id="quantity" class="quantity">推奨 0個</div><div id="reasons" class="reasons"></div></section>
<section class="nearby"><button id="nearbyButton" class="secondary" type="button">同じ棚をチェック</button><div id="nearbyList"></div></section><div class="sheet-actions"><button id="refreshButton" class="secondary" type="button">Keepa再取得</button><button id="closeButton" class="close" type="button">閉じる</button></div></div></div></body></html>
